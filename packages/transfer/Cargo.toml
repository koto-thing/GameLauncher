[package]
name = "pandd-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
http = ["dep:reqwest", "dep:tokio", "dep:futures-util", "dep:sha2", "dep:pandd-local-storage"]

[dependencies]
anyhow = "1"
tempfile = "3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }
pandd-local-storage = { path = "../local-storage", optional = true }
