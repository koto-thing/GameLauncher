[package]
name = "pandd-distribution-contracts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
signing = ["ed25519-dalek/pem"]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
jsonschema = { version = "0.46", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
