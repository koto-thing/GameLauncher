name: Publish desktop production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PRODUCTION_BASE_URL: https://downloads.koto-thing.com
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
  PANDD_CUBISM_LICENSE_ACCEPTED: ${{ vars.PANDD_CUBISM_LICENSE_ACCEPTED }}

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify release commit is on master
        run: git merge-base --is-ancestor origin/master HEAD
      - name: Validate release version
        run: python -m scripts.release.validate_release_version "$GITHUB_REF_NAME"

  build-windows:
    needs: verify-tag
    runs-on: windows-2022
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: 14.44
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure production launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=production
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.PRODUCTION_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT"
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build --parallel
          cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate SBOM and license bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version $version --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.release.collect_licenses --output staging/licenses
      - name: Smoke test deployment
        shell: pwsh
        run: ./scripts/verification/smoke_test_windows.ps1 -Executable 'staging/bin/PandD Game Launcher.exe'
      - name: Build unsigned online installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python apps/launcher/installer/build.py --install-tree staging --output ifw --version $version --repository-url "${{ env.PRODUCTION_BASE_URL }}/v1/launcher/ifw/windows/x86_64"
      - name: Package and checksum unsigned artifacts
        shell: pwsh
        run: |
          $archive = 'ifw/PandD-Game-Launcher-windows-x86_64.zip'
          Compress-Archive -Path 'staging/*' -DestinationPath $archive -CompressionLevel Optimal
          python -m scripts.release.generate_checksums `
            'ifw/PandD-Game-Launcher-Online-Installer.exe' `
            $archive
          python -m scripts.release.generate_checksums --check `
            'ifw/PandD-Game-Launcher-Online-Installer.exe.sha256' `
            "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-production-${{ github.ref_name }}
          path: |
            staging
            ifw

  build-linux:
    needs: verify-tag
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: linux_gcc_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure production launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=production
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.PRODUCTION_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT"
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate SBOM and license bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version "$version" --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          python -m scripts.release.collect_licenses --output staging/licenses
      - name: Verify and smoke test deployment
        run: bash scripts/verification/smoke_test_linux.sh 'staging/bin/PandD Game Launcher'
      - name: Build online installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          python apps/launcher/installer/build.py --install-tree staging --output ifw --version "$version" --repository-url "${PRODUCTION_BASE_URL}/v1/launcher/ifw/linux/x86_64"
      - name: Package deployment tree
        run: tar -C staging -czf ifw/PandD-Game-Launcher-linux-x86_64.tar.gz .
      - name: Import Linux release signing key
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/linux-release-key.gpg"
          gpg --batch --import "$RUNNER_TEMP/linux-release-key.gpg"
      - name: Sign and verify Linux artifacts
        env:
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          bash scripts/signing/sign_linux.sh ifw/PandD-Game-Launcher-Online-Installer "$LINUX_GPG_KEY_ID"
          bash scripts/signing/sign_linux.sh ifw/PandD-Game-Launcher-linux-x86_64.tar.gz "$LINUX_GPG_KEY_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-production-${{ github.ref_name }}
          path: |
            staging
            ifw

  build-macos:
    needs: verify-tag
    runs-on: macos-15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: clang_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure production launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=production
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.PRODUCTION_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT"
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and install
        run: |
          cmake --build build --parallel
          cmake --install build --prefix "${GITHUB_WORKSPACE}/staging"
      - name: Generate SBOM and license bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version "$version" --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          python -m scripts.release.collect_licenses --output staging/licenses
      - name: Smoke test deployment
        run: bash scripts/verification/smoke_test_macos.sh 'staging/PandD Game Launcher.app'
      - name: Import Developer ID certificate and configure notarization
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/pandd-developer-id.p12"
          keychain="$RUNNER_TEMP/pandd-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials pandd-notary \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD"
      - name: Sign, notarize, and staple launcher
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: bash scripts/signing/sign_macos.sh 'staging/PandD Game Launcher.app' "$MACOS_DEVELOPER_ID_APPLICATION" pandd-notary
      - name: Build online installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          python apps/launcher/installer/build.py --install-tree staging --output ifw --version "$version" --repository-url "${PRODUCTION_BASE_URL}/v1/launcher/ifw/macos/arm64"
      - name: Sign, notarize, and staple online installer
        env:
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: bash scripts/signing/sign_macos.sh 'ifw/PandD-Game-Launcher-Online-Installer.app' "$MACOS_DEVELOPER_ID_APPLICATION" pandd-notary
      - name: Package and checksum notarized artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'ifw/PandD-Game-Launcher-Online-Installer.app' 'ifw/PandD-Game-Launcher-Online-Installer-macos-arm64.zip'
          ditto -c -k --sequesterRsrc staging 'ifw/PandD-Game-Launcher-macos-arm64.zip'
          python -m scripts.release.generate_checksums \
            'ifw/PandD-Game-Launcher-Online-Installer-macos-arm64.zip' \
            'ifw/PandD-Game-Launcher-macos-arm64.zip'
          python -m scripts.release.generate_checksums --check \
            'ifw/PandD-Game-Launcher-Online-Installer-macos-arm64.zip.sha256' \
            'ifw/PandD-Game-Launcher-macos-arm64.zip.sha256'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-production-${{ github.ref_name }}
          path: |
            staging
            ifw

  publish:
    concurrency:
      group: launcher-production-publication
      cancel-in-progress: false
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Publisher dependencies
        run: python -m pip install --requirement services/deployment_publisher/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-production-${{ github.ref_name }}
          path: artifacts/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-production-${{ github.ref_name }}
          path: artifacts/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-production-${{ github.ref_name }}
          path: artifacts/macos
      - name: Assemble public production tree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          for platform_arch in windows/x86_64 linux/x86_64 macos/arm64; do
            platform=${platform_arch%/*}
            arch=${platform_arch#*/}
            mkdir -p "public/v1/launcher/ifw/$platform/$arch"
            cp -a "artifacts/$platform/ifw/repository/." "public/v1/launcher/ifw/$platform/$arch/"
            destination="public/v1/launcher/installers/$platform/$arch/$version"
            mkdir -p "$destination"
            find "artifacts/$platform/ifw" -maxdepth 1 -type f -name 'PandD-Game-Launcher-*' -exec cp {} "$destination/" \;
          done
          python services/deployment_publisher/publisher.py publish-announcements --source services/distribution-content/content/announcements --output public
          for locale in ja-JP en-US; do
            python services/deployment_publisher/publisher.py publish-changelog --source "services/distribution-content/content/launcher/changelog.$locale.json" --output public --locale "$locale"
            for platform_arch in windows/x86_64 linux/x86_64 macos/arm64; do
              platform=${platform_arch%/*}
              arch=${platform_arch#*/}
              python services/deployment_publisher/publisher.py publish-launcher --source "services/distribution-content/content/launcher/release.$locale.json" --output public --base-url "$PRODUCTION_BASE_URL" --locale "$locale" --platform "$platform" --arch "$arch"
            done
          done
      - name: Reject an older release before changing the IFW repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.release.promote_installer --check-only --version "${GITHUB_REF_NAME#v}" --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET"
      - name: Upload immutable objects then mutable pointers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws --version
          python services/deployment_publisher/publisher.py upload --output public --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET"
          python services/deployment_publisher/publisher.py gc-remote --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET" --grace-days 7
      - name: Publish desktop artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Windows artifacts are unsigned and include SHA-256 sidecars. Linux artifacts include SHA-256 sidecars and detached OpenPGP signatures. macOS arm64 artifacts are Developer ID signed, notarized, stapled, and include SHA-256 sidecars."
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/windows/ifw/PandD-Game-Launcher-Online-Installer.exe \
            artifacts/windows/ifw/PandD-Game-Launcher-Online-Installer.exe.sha256 \
            artifacts/windows/ifw/PandD-Game-Launcher-windows-x86_64.zip \
            artifacts/windows/ifw/PandD-Game-Launcher-windows-x86_64.zip.sha256 \
            artifacts/linux/ifw/PandD-Game-Launcher-Online-Installer \
            artifacts/linux/ifw/PandD-Game-Launcher-Online-Installer.sha256 \
            artifacts/linux/ifw/PandD-Game-Launcher-Online-Installer.asc \
            artifacts/linux/ifw/PandD-Game-Launcher-linux-x86_64.tar.gz \
            artifacts/linux/ifw/PandD-Game-Launcher-linux-x86_64.tar.gz.sha256 \
            artifacts/linux/ifw/PandD-Game-Launcher-linux-x86_64.tar.gz.asc \
            artifacts/macos/ifw/PandD-Game-Launcher-Online-Installer-macos-arm64.zip \
            artifacts/macos/ifw/PandD-Game-Launcher-Online-Installer-macos-arm64.zip.sha256 \
            artifacts/macos/ifw/PandD-Game-Launcher-macos-arm64.zip \
            artifacts/macos/ifw/PandD-Game-Launcher-macos-arm64.zip.sha256 \
            --clobber
      - name: Promote verified Windows installer download
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.release.promote_installer --version "${GITHUB_REF_NAME#v}" --artifact artifacts/windows/ifw/PandD-Game-Launcher-Online-Installer.exe --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET"
