name: Publish Windows production

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PRODUCTION_BASE_URL: https://downloads.koto-thing.com

jobs:
  build:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/run-vcpkg@v11
      - name: Validate release version
        shell: pwsh
        run: python scripts/validate_release_version.py "${{ github.ref_name }}"
      - name: Configure production launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=production
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.PRODUCTION_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build --parallel
          cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate SBOM and license bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python scripts/generate_sbom.py --output staging/docs/pandd-game-launcher.spdx.json --version $version --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          python scripts/collect_licenses.py --output staging/licenses
      - name: Smoke test deployment
        shell: pwsh
        run: ./scripts/smoke_test_windows.ps1 -Executable 'staging/bin/PandD Game Launcher.exe'
      - name: Build unsigned online installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python installer/build.py --install-tree staging --output ifw --version $version --repository-url "${{ env.PRODUCTION_BASE_URL }}/v1/launcher/ifw/windows/x86_64"
      - name: Package and checksum unsigned artifacts
        shell: pwsh
        run: |
          $archive = 'ifw/PandD-Game-Launcher-windows-x86_64.zip'
          Compress-Archive -Path 'staging/*' -DestinationPath $archive -CompressionLevel Optimal
          python scripts/generate_checksums.py `
            'ifw/PandD-Game-Launcher-Online-Installer.exe' `
            $archive
          python scripts/generate_checksums.py --check `
            'ifw/PandD-Game-Launcher-Online-Installer.exe.sha256' `
            "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-production-${{ github.ref_name }}
          path: |
            staging
            ifw

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Publisher dependencies
        run: python -m pip install --requirement publisher/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: windows-production-${{ github.ref_name }}
          path: artifact
      - name: Assemble public production tree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p public/v1/launcher/ifw/windows/x86_64
          cp -a artifact/ifw/repository/. public/v1/launcher/ifw/windows/x86_64/
          destination="public/v1/launcher/installers/windows/x86_64/$version"
          mkdir -p "$destination"
          cp artifact/ifw/PandD-Game-Launcher-Online-Installer.exe* "$destination/"
          cp artifact/ifw/PandD-Game-Launcher-windows-x86_64.zip* "$destination/"
          python publisher/publisher.py publish-announcements --source backend/content/announcements --output public
          for locale in ja-JP en-US; do
            python publisher/publisher.py publish-changelog --source "backend/content/launcher/changelog.$locale.json" --output public --locale "$locale"
            python publisher/publisher.py publish-launcher --source "backend/content/launcher/release.$locale.json" --output public --base-url "$PRODUCTION_BASE_URL" --locale "$locale" --platform windows --arch x86_64
          done
      - name: Upload immutable objects then mutable pointers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws --version
          python publisher/publisher.py upload --output public --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET"
          python publisher/publisher.py gc-remote --endpoint "$R2_ENDPOINT" --bucket "$R2_BUCKET" --grace-days 7
      - name: Publish unsigned artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Unsigned Windows release. Verify the attached SHA-256 files before running; Windows SmartScreen will report an unknown publisher."
          gh release upload "$GITHUB_REF_NAME" \
            artifact/ifw/PandD-Game-Launcher-Online-Installer.exe \
            artifact/ifw/PandD-Game-Launcher-Online-Installer.exe.sha256 \
            artifact/ifw/PandD-Game-Launcher-windows-x86_64.zip \
            artifact/ifw/PandD-Game-Launcher-windows-x86_64.zip.sha256 \
            --clobber
