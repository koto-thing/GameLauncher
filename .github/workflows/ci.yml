name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'apps/docs/**', 'apps/docs-worker/**', '.github/workflows/docs-pages.yml', '.github/workflows/docs-cloudflare.yml']
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'apps/docs/**', 'apps/docs-worker/**', '.github/workflows/docs-pages.yml', '.github/workflows/docs-cloudflare.yml']

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
  PANDD_CUBISM_LICENSE_ACCEPTED: ${{ vars.PANDD_CUBISM_LICENSE_ACCEPTED }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-client:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: linux_gcc_64
          cache: true
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y doxygen clang-tidy libgl1-mesa-dev libglu1-mesa-dev
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DPANDD_ENABLE_CLANG_TIDY=ON "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Check formatting
        run: find apps/launcher/src apps/launcher/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check API documentation
        run: cmake --build build --target docs-check

  client:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            qt_arch: win64_msvc2022_64
            clang_tidy: 'OFF'
          - os: macos-15
            platform: macos
            arch: arm64
            qt_arch: clang_64
            clang_tidy: 'OFF'
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            qt_arch: linux_gcc_64
            clang_tidy: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.qt_arch }}
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: 14.44
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Install Linux quality tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y doxygen clang-tidy libgl1-mesa-dev libglu1-mesa-dev
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DPANDD_ENABLE_CLANG_TIDY=${{ matrix.clang_tidy }} "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Check formatting
        if: runner.os == 'Linux'
        run: find apps/launcher/src apps/launcher/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check API documentation
        if: runner.os == 'Linux'
        run: cmake --build build --target docs-check
      - name: Create unsigned deployment tree
        if: github.event_name == 'push'
        run: cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate main-branch SBOM
        if: github.event_name == 'push'
        run: python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version 1.0.0 --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
      - name: Collect pinned license texts
        if: github.event_name == 'push'
        run: python -m scripts.release.collect_licenses --output staging/licenses
      - name: Run local Qt IFW installer E2E
        if: github.event_name == 'push'
        run: python -m apps.launcher.installer.e2e --install-tree staging --output ifw-e2e --version 1.0.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: unsigned-main-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            staging
            ifw-e2e

  publisher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Publisher dependencies
        run: python -m pip install --requirement services/deployment_publisher/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s services/deployment_publisher -p 'test_*.py' -v
      - name: Installer metadata tests
        run: python -m unittest discover -s apps/launcher/installer -p 'test_*.py' -v
      - name: Compile check
        run: python -m compileall -q services/deployment_publisher apps/launcher/installer scripts
      - name: SBOM tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  contracts:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned contract validator
        run: python -m pip install --requirement services/deployment_publisher/requirements.txt
      - name: Validate schemas and reviewed sources
        run: python -m unittest discover -s packages/contracts -p 'test_*.py' -v
      - name: Reject secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-vulnerabilities:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies with OSV-Scanner
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src:ro"
          ghcr.io/google/osv-scanner:v2.4.0
          scan source --recursive /src
