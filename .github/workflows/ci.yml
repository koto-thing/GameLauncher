name: CI

on:
  workflow_dispatch:
    inputs:
      installer-compression:
        description: Qt IFW compression for measurement (production releases are unchanged)
        type: choice
        options: ['1', '5']
        default: '1'
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 300M
  PANDD_CUBISM_LICENSE_ACCEPTED: ${{ vars.PANDD_CUBISM_LICENSE_ACCEPTED }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      launcher: ${{ steps.affected.outputs.launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify change selection
        run: python -m unittest scripts.tests.test_affected_components -v
      - name: Select affected components
        id: affected
        run: python -m scripts.ci.affected_components

  analytics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/platform-api/package-lock.json
      - name: Install analytics API dependencies
        run: npm ci --prefix services/platform-api
      - name: Install repository Rust toolchain and Wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Regenerate analytics Rust module when available
        run: |
          npm run rust:build --if-present --prefix services/platform-api
          git diff --exit-code -- services/platform-api
      - name: Check analytics API
        run: npm run check --prefix services/platform-api

  pull-request-client:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Use Ubuntu package sources for build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Ignore unrelated third-party repositories preinstalled on hosted runners
          test -f /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99pandd-sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.2'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          arch: linux_gcc_64
          cache: true
      - name: Identify native compiler and SDK
        id: compiler
        run: python -m scripts.ci.compiler_identity
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-debug-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-debug-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}-
      - name: Record restored package contents
        id: vcpkg-before
        shell: bash
        env:
          CACHE_CONTENTS: ${{ hashFiles('.vcpkg-binary-cache/**/*.zip') }}
        run: echo "contents=$CACHE_CONTENTS" >> "$GITHUB_OUTPUT"
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y ccache doxygen clang-tidy-20 libgl1-mesa-dev libglu1-mesa-dev
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install launcher Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Cache launcher Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: launcher-debug-${{ steps.compiler.outputs.key }}-${{ hashFiles('cmake/Rust.cmake') }}
          workspaces: . -> build/rust/Debug
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Restore Linux compiler cache
        if: runner.os == 'Linux'
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DPANDD_ENABLE_CLANG_TIDY=ON -DCLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-20 "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      # Save immediately after dependency construction, even if later tests fail
      - name: Save completed vcpkg packages
        if: github.ref == 'refs/heads/master' && hashFiles('.vcpkg-binary-cache/**/*.zip') != '' && hashFiles('.vcpkg-binary-cache/**/*.zip') != steps.vcpkg-before.outputs.contents
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build build --parallel
      - name: Report Linux compiler cache hits
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats
      - name: Save Linux compiler cache
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Use a physical macOS temporary directory
        if: runner.os == 'macOS'
        run: python -c "import os; print('TMPDIR=' + os.path.realpath(os.environ['TMPDIR']), file=open(os.environ['GITHUB_ENV'], 'a'))"
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Check formatting
        run: find apps/launcher/src apps/launcher/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check API documentation
        run: cmake --build build --target docs-check

  client:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.launcher == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
            qt_arch: win64_msvc2022_64
            clang_tidy: 'OFF'
          - os: macos-15
            platform: macos
            arch: arm64
            qt_arch: clang_64
            clang_tidy: 'OFF'
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            qt_arch: linux_gcc_64
            clang_tidy: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Use Ubuntu package sources for build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Ignore unrelated third-party repositories preinstalled on hosted runners
          test -f /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99pandd-sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.2'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          arch: ${{ matrix.qt_arch }}
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: 14.44
      - name: Identify native compiler and SDK
        id: compiler
        run: python -m scripts.ci.compiler_identity
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-debug-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-debug-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}-
      - name: Record restored package contents
        id: vcpkg-before
        shell: bash
        env:
          CACHE_CONTENTS: ${{ hashFiles('.vcpkg-binary-cache/**/*.zip') }}
        run: echo "contents=$CACHE_CONTENTS" >> "$GITHUB_OUTPUT"
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Install Linux quality tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache doxygen clang-tidy-20 libgl1-mesa-dev libglu1-mesa-dev
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install launcher Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Cache launcher Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: launcher-debug-${{ steps.compiler.outputs.key }}-${{ hashFiles('cmake/Rust.cmake') }}
          workspaces: . -> build/rust/Debug
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Restore Linux compiler cache
        if: runner.os == 'Linux'
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-
      - name: Configure
        shell: pwsh
        run: |
          $qualityArguments = @()
          if ('${{ matrix.clang_tidy }}' -eq 'ON') {
            $qualityArguments += '-DCLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-20'
            $qualityArguments += '-DCMAKE_C_COMPILER_LAUNCHER=ccache'
            $qualityArguments += '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
          }

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DPANDD_ENABLE_CLANG_TIDY=${{ matrix.clang_tidy }} @qualityArguments "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT" "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      # Save immediately after dependency construction, even if later tests fail
      - name: Save completed vcpkg packages
        if: github.ref == 'refs/heads/master' && hashFiles('.vcpkg-binary-cache/**/*.zip') != '' && hashFiles('.vcpkg-binary-cache/**/*.zip') != steps.vcpkg-before.outputs.contents
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build build --parallel
      - name: Report Linux compiler cache hits
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats
      - name: Save Linux compiler cache
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Use a physical macOS temporary directory
        if: runner.os == 'macOS'
        run: python -c "import os; print('TMPDIR=' + os.path.realpath(os.environ['TMPDIR']), file=open(os.environ['GITHUB_ENV'], 'a'))"
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: Check formatting
        if: runner.os == 'Linux'
        run: find apps/launcher/src apps/launcher/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check API documentation
        if: runner.os == 'Linux'
        run: cmake --build build --target docs-check
      - name: Create unsigned deployment tree
        if: github.event_name != 'pull_request'
        run: cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate main-branch SBOM
        if: github.event_name != 'pull_request'
        run: python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version 1.0.0 --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
      - name: Collect pinned license texts
        if: github.event_name != 'pull_request'
        run: python -m scripts.release.collect_licenses --output staging/licenses
      - name: Run local Qt IFW installer E2E
        if: github.event_name != 'pull_request'
        run: python -m apps.launcher.installer.e2e --install-tree staging --output ifw-e2e --version 1.0.0 --compression ${{ inputs.installer-compression || '1' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: unsigned-main-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            staging
            ifw-e2e

  publisher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Python contract validators
        run: python -m pip install --requirement packages/contracts/requirements.txt
      - name: Install Publisher Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Cache Publisher Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: publisher
          workspaces: . -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build Rust Publisher
        shell: bash
        run: |
          cargo +1.94.1 build --release --locked --manifest-path services/deployment_publisher/Cargo.toml
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Shared Rust workspace checks
        run: |
          rustup component add rustfmt clippy --toolchain 1.94.1
          cargo +1.94.1 fmt --all --check
          cargo +1.94.1 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.94.1 test --locked --workspace
          python -m unittest discover -s services/deployment_publisher/tests -p 'test_*.py' -v
      - name: Installer metadata tests
        run: python -m unittest discover -s apps/launcher/installer -p 'test_*.py' -v
      - name: Physical edition packaging tests
        run: python -m unittest discover -s scripts/editions -p 'test_*.py' -v
      - name: Compile check
        run: python -m compileall -q packages/contracts apps/launcher/installer scripts
      - name: SBOM tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  contracts:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}
          persist-credentials: false
      - name: Fetch only the selected history for a manual secret scan
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags --unshallow origin "$GITHUB_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned contract validator
        run: python -m pip install --requirement packages/contracts/requirements.txt
      - name: Validate schemas and reviewed sources
        run: python -m unittest discover -s packages/contracts -p 'test_*.py' -v
      - name: Reject secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-vulnerabilities:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies with OSV-Scanner
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src:ro"
          ghcr.io/google/osv-scanner:v2.4.0
          scan source --recursive /src

  result:
    name: CI result
    if: always()
    needs: [changes, analytics, pull-request-client, client, publisher, contracts, dependency-vulnerabilities]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['NEEDS'])
          expected = {name: 'success' for name in needs}
          launcher = needs['changes']['outputs'].get('launcher')
          assert launcher in ('true', 'false'), 'Missing launcher decision'
          expected['pull-request-client'] = 'success' if launcher == 'true' and os.environ['EVENT_NAME'] == 'pull_request' else 'skipped'
          expected['client'] = 'success' if launcher == 'true' and os.environ['EVENT_NAME'] != 'pull_request' else 'skipped'
          failures = {name: value['result'] for name, value in needs.items() if value['result'] != expected[name]}
          assert not failures, f'Checks did not finish as expected: {failures}'
          PY
