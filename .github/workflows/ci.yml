name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            qt_arch: win64_msvc2022_64
            clang_tidy: 'OFF'
          - os: macos-15
            platform: macos
            arch: arm64
            qt_arch: clang_64
            clang_tidy: 'OFF'
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            qt_arch: linux_gcc_64
            clang_tidy: 'ON'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.qt_arch }}
          tools: 'tools_ifw,qt.tools.ifw.411'
          cache: true
      - uses: lukka/run-vcpkg@v11
      - name: Install Linux quality tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y doxygen clang-tidy
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DPANDD_ENABLE_CLANG_TIDY=${{ matrix.clang_tidy }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check formatting
        if: runner.os == 'Linux'
        run: find client/src client/tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check API documentation
        if: runner.os == 'Linux'
        run: cmake --build build --target docs-check
      - name: Create unsigned deployment tree
        if: github.event_name == 'push'
        run: cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate main-branch SBOM
        if: github.event_name == 'push'
        run: python scripts/generate_sbom.py --output staging/docs/pandd-game-launcher.spdx.json --version 1.0.0 --build-metadata build/pandd-build-metadata.json --ifw-version 4.11.0
      - name: Collect pinned license texts
        if: github.event_name == 'push'
        run: python scripts/collect_licenses.py --output staging/licenses
      - name: Run local Qt IFW installer E2E
        if: github.event_name == 'push'
        run: python -m installer.e2e --install-tree staging --output ifw-e2e --version 1.0.0
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: unsigned-main-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            staging
            ifw-e2e

  publisher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Publisher dependencies
        run: python -m pip install --requirement publisher/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s publisher -p 'test_*.py' -v
      - name: Installer metadata tests
        run: python -m unittest discover -s installer -p 'test_*.py' -v
      - name: Compile check
        run: python -m compileall -q publisher installer scripts
      - name: SBOM tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned contract validator
        run: python -m pip install --requirement publisher/requirements.txt
      - name: Validate schemas and reviewed sources
        run: python -m unittest discover -s contracts -p 'test_*.py' -v
      - name: Reject secrets
        uses: gitleaks/gitleaks-action@v2

  dependency-vulnerabilities:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1.9.2
