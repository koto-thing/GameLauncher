name: Documentation Pages

on:
  pull_request:
    paths:
      - apps/docs/**
      - apps/launcher/src/**
      - docs/**
      - packages/contracts/**
      - CMakeLists.txt
      - .github/workflows/docs-pages.yml
  push:
    branches: [master]
    paths:
      - apps/docs/**
      - apps/launcher/src/**
      - docs/**
      - packages/contracts/**
      - CMakeLists.txt
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCS_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install the verified Doxygen generator
        run: |
          curl --proto '=https' --fail --location https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o "$RUNNER_TEMP/doxygen.tar.gz"
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install documentation dependencies
        working-directory: apps/docs
        run: npm ci
      - name: Validate OpenAPI and documentation sources
        working-directory: apps/docs
        run: npm run lint
      - name: Run documentation tests
        working-directory: apps/docs
        run: npm test
      - name: Build VitePress site
        working-directory: apps/docs
        run: npm run build
      - name: Generate Launcher C++ reference
        run: |
          cmake -S . -B build/docs-api -DPANDD_DOCS_ONLY=ON
          cmake --build build/docs-api --target docs-check
          mkdir -p apps/docs/dist/reference/cpp
          cp -R build/docs-api/docs/doxygen/html/. apps/docs/dist/reference/cpp/
      - name: Check generated links and public artifact
        working-directory: apps/docs
        run: node scripts/check-built-site.mjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
