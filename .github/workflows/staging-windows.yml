name: Publish Windows staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish
        required: true
        default: 1.0.0

permissions:
  contents: read

env:
  STAGING_BASE_URL: https://pub-1ada658d7c4f46b1bf109646a4a68bcb.r2.dev
  STAGING_BUCKET: pandd-launcher-staging
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
  PANDD_CUBISM_LICENSE_ACCEPTED: ${{ vars.PANDD_CUBISM_LICENSE_ACCEPTED }}

jobs:
  build:
    runs-on: windows-2022
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: 14.44
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate version
        shell: pwsh
        env:
          STAGING_VERSION: ${{ inputs.version }}
        run: python -m scripts.release.validate_release_version "$env:STAGING_VERSION"
      - name: Configure staging launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=staging
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.STAGING_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT"
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build --parallel
          cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Generate release metadata
        shell: pwsh
        env:
          STAGING_VERSION: ${{ inputs.version }}
        run: |
          python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version "$env:STAGING_VERSION" --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.release.collect_licenses --output staging/licenses
      - name: Smoke test deployment
        shell: pwsh
        run: ./scripts/verification/smoke_test_windows.ps1 -Executable 'staging/bin/PandD Game Launcher.exe'
      - name: Build unsigned online installer
        shell: pwsh
        env:
          STAGING_VERSION: ${{ inputs.version }}
        run: >-
          python apps/launcher/installer/build.py
          --install-tree staging
          --output ifw
          --version "$env:STAGING_VERSION"
          --repository-url "${{ env.STAGING_BASE_URL }}/v1/launcher/ifw/windows/x86_64"
      - name: Package and checksum unsigned artifacts
        shell: pwsh
        run: |
          $archive = 'ifw/PandD-Game-Launcher-windows-x86_64.zip'
          Compress-Archive -Path 'staging/*' -DestinationPath $archive -CompressionLevel Optimal
          python -m scripts.release.generate_checksums `
            'ifw/PandD-Game-Launcher-Online-Installer.exe' `
            $archive
          python -m scripts.release.generate_checksums --check `
            'ifw/PandD-Game-Launcher-Online-Installer.exe.sha256' `
            "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-staging-${{ inputs.version }}
          path: |
            staging
            ifw

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Publisher dependencies
        run: python -m pip install --requirement services/deployment_publisher/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-staging-${{ inputs.version }}
          path: artifact
      - name: Assemble public staging tree
        env:
          STAGING_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p public/v1/launcher/ifw/windows/x86_64
          cp -a artifact/ifw/repository/. public/v1/launcher/ifw/windows/x86_64/
          destination="public/v1/launcher/installers/windows/x86_64/$STAGING_VERSION"
          mkdir -p "$destination"
          cp artifact/ifw/PandD-Game-Launcher-Online-Installer.exe* "$destination/"
          cp artifact/ifw/PandD-Game-Launcher-windows-x86_64.zip* "$destination/"
          python services/deployment_publisher/publisher.py publish-announcements --source services/distribution-content/content/announcements --output public
          for locale in ja-JP en-US; do
            python services/deployment_publisher/publisher.py publish-changelog --source "services/distribution-content/content/launcher/changelog.$locale.json" --output public --locale "$locale"
            python services/deployment_publisher/publisher.py publish-launcher --source "services/distribution-content/content/launcher/release.$locale.json" --output public --base-url "$STAGING_BASE_URL" --locale "$locale" --platform windows --arch x86_64
          done
      - name: Upload immutable objects then mutable pointers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          aws --version
          python services/deployment_publisher/publisher.py upload --output public --endpoint "$R2_ENDPOINT" --bucket "$STAGING_BUCKET"
