name: Music validation
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/music/**', 'apps/admin-web/**', 'server/music/**', 'contracts/music/**', '.github/workflows/music-check.yml']
  push:
    paths: ['apps/music/**', 'apps/admin-web/**', 'server/music/**', 'contracts/music/**', '.github/workflows/music-check.yml']
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/music
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/music/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/admin-web
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd
          tools: composer:v2
      - run: composer install --no-dev --prefer-dist --no-interaction
        working-directory: server/music
      - run: npm run check
      - run: npm test
        working-directory: apps/admin-web
      - run: npm run lint
        working-directory: apps/admin-web
      - run: npm run browsers:install -- --with-deps
      - name: Start virtual audio output
        # Firefoxの実音声出力を検証する。音声APIのモックや再生テストのスキップはしない。
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=music_ci rate=48000 channels=2
          pactl set-default-sink music_ci
          pactl info
      - run: npm run test:e2e
      - run: npm run test:public
      - run: npm run package:rental
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: music-rental-package
          path: apps/music/build/rental-package-*/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: music-test-results
          path: |
            apps/music/build/e2e-results.json
            apps/music/build/public-independence.json
            apps/music/build/public-workers-stopped-390.png
            apps/music/build/home-*.png
            apps/music/build/game-design-*.png
            apps/music/build/theme-dark-*.png
            apps/music/build/carousel-*.png
            apps/music/test-results/
