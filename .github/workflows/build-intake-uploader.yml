name: Build intake uploader

on:
  workflow_dispatch:
  push:
    paths:
      - apps/intake-uploader/**
      - contracts/schemas/**
      - publisher/**
      - .github/workflows/build-intake-uploader.yml

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/uploader-v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build Windows executable
        shell: pwsh
        run: ./apps/intake-uploader/scripts/Build-Windows.ps1 -PythonExecutable (Get-Command python.exe).Source
      - name: Verify packaged schemas
        shell: pwsh
        run: |
          $env:PANDD_SELF_TEST_RESULT = Join-Path $env:RUNNER_TEMP 'uploader-self-test.txt'
          $process = Start-Process ./apps/intake-uploader/artifacts/PandDIntakeUploader.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $env:PANDD_SELF_TEST_RESULT; exit $process.ExitCode }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PandDIntakeUploader-windows-x86_64
          path: apps/intake-uploader/artifacts/PandDIntakeUploader.exe
          if-no-files-found: error
