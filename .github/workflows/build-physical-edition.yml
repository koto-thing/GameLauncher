name: Build physical Windows edition

on:
  workflow_dispatch:
    inputs:
      edition_id:
        description: Fixed physical edition ID
        required: true
        type: string
      build_id:
        description: Control-Plane build ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PRODUCTION_BASE_URL: https://downloads.koto-thing.com
  DEPLOYMENT_CONTROL_PLANE_URL: ${{ vars.DEPLOYMENT_CONTROL_PLANE_URL }}
  EDITION_ID: ${{ inputs.edition_id }}
  EDITION_BUILD_ID: ${{ inputs.build_id }}
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
  PANDD_CUBISM_LICENSE_ACCEPTED: ${{ vars.PANDD_CUBISM_LICENSE_ACCEPTED }}

jobs:
  build:
    runs-on: windows-2022
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install publisher dependencies
        run: python -m pip install --requirement services/deployment_publisher/requirements.txt
      - name: Freeze public Windows releases
        id: freeze
        env:
          MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
        run: python -m scripts.editions.build freeze
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          tools: 'tools_ifw,qt.tools.ifw.47'
          cache: true
      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
          toolset: 14.44
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
      - name: Download official Cubism SDK
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'cubism-sdk/CubismSdkForNative-5-r.5'
          python -m scripts.dependencies.download_cubism_sdk --destination $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PANDD_CUBISM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure production launcher
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DPANDD_DISTRIBUTION_ENV=production
          -DPANDD_DISTRIBUTION_BASE_URL=${{ env.PRODUCTION_BASE_URL }}/
          -DPANDD_BUILD_NUMBER=${{ github.run_number }}
          "-DPANDD_CUBISM_SDK_ROOT=$env:PANDD_CUBISM_SDK_ROOT"
          -DPANDD_MANIFEST_PUBLIC_KEY_BASE64=${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --prefix "${{ github.workspace }}/staging"
      - name: Resolve launcher version
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(PandDGameLauncher VERSION ([0-9.]+)').Matches.Groups[1].Value
          if (-not $version) { throw 'Launcher version is unavailable' }
          "EDITION_LAUNCHER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate SBOM and license bundle
        shell: pwsh
        env:
          RELEASE_TAG: v${{ env.EDITION_LAUNCHER_VERSION }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python -m scripts.release.generate_sbom --output staging/docs/pandd-game-launcher.spdx.json --version $version --build-metadata build/pandd-build-metadata.json --ifw-version 4.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.release.collect_licenses --output staging/licenses
      - name: Smoke test deployment
        shell: pwsh
        run: ./scripts/verification/smoke_test_windows.ps1 -Executable 'staging/bin/PandD Game Launcher.exe'
      - name: Assemble verified offline game media
        env:
          MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.MANIFEST_PUBLIC_KEY_BASE64 }}
          MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.MANIFEST_PRIVATE_KEY_PEM }}
        run: python -m scripts.editions.build assemble --version "$env:EDITION_LAUNCHER_VERSION"
      - name: Build selectable offline installer
        run: python -m scripts.editions.build package --version "$env:EDITION_LAUNCHER_VERSION"
      - name: Checksum physical installer
        run: python -m scripts.release.generate_checksums physical-distribution/Setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: distribution
        with:
          name: physical-windows-${{ inputs.edition_id }}-${{ inputs.build_id }}
          path: physical-distribution
          if-no-files-found: error
          retention-days: 90
      - name: Record build result
        if: ${{ always() && steps.freeze.outcome == 'success' }}
        env:
          EDITION_BUILD_STATUS: ${{ job.status }}
          EDITION_ARTIFACT_ID: ${{ steps.distribution.outputs.artifact-id }}
        run: python -m scripts.editions.build status
