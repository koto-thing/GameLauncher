[package]
name = "lt-mail"
version = "0.1.0"
edition = "2024"
[workspace]
[features]
default = []
test-clock = []
worker-runtime = ["dep:worker", "dep:serde_json"]
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", optional = true }
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "00aab4612c2acd995df7fb6638353051bf33c5c4", features = ["d1"], optional = true }
