[package]
name = "lt-api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }

serde_json = "=1.0.154"

serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.34"
sha2 = "=0.11.1"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Crypto"] }

[features]
local-development = []
runtime-tests = []

[workspace]
