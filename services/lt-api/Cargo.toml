[package]
name = "lt-api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lt-mail = { path = "../lt-mail", features = ["worker-runtime"] }
worker = { git = "https://github.com/cloudflare/workers-rs", rev = "00aab4612c2acd995df7fb6638353051bf33c5c4", features = ["d1"] }

serde_json = "=1.0.154"

serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing"] }
futures-util = "=0.3.34"
sha2 = "=0.11.1"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Crypto"] }

[features]
local-development = []
production-api = []
runtime-tests = ["lt-mail/test-clock"]

[workspace]

# Wasmの初回実行負荷を比較する単一release候補
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
