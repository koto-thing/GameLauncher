[package]
name = "pandd-launcher-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
pandd-transfer = { path = "../../../packages/transfer", features = ["http"] }
pandd-local-storage = { path = "../../../packages/local-storage" }
pandd-file-integrity = { path = "../../../packages/file-integrity" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx = "1"
pandd-distribution-contracts = { path = "../../../packages/distribution-contracts" }

[build-dependencies]
cxx-build = "1"

[dev-dependencies]
tempfile = "3"
