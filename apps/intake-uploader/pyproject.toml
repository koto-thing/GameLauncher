[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pandd-intake-uploader"
version = "0.1.0"
description = "PandD desktop intake artifact uploader"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6==6.10.2",
  "jsonschema[format]==4.26.0",
]

[project.gui-scripts]
pandd-intake-uploader = "pandd_intake_uploader.main:main"

[tool.setuptools.packages.find]
where = ["src"]
